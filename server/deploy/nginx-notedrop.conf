# NoteDrop 反向代理片段。
# 通过子路径 /notedrop/ 暴露，复用站点已有的 TLS 证书，
# 因此不需要新的域名、新的证书，也不需要额外开放端口。
#
# 注意：/notedrop/ws 是 WebSocket，必须单独放行并升级协议，
# 否则长连接会在 nginx 这一层被当成普通 HTTP 请求而失败。

location = /notedrop {
    return 301 /notedrop/;
}

location /notedrop/ {
    # 去掉 /notedrop 前缀再转发给后端，后端路由保持 /api/... 不变
    proxy_pass http://127.0.0.1:8090/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 纸条走 base64 涂鸦，放宽 body 限制
    client_max_body_size 12m;
    proxy_read_timeout 120s;
}

location /notedrop/ws {
    proxy_pass http://127.0.0.1:8090/ws;

    proxy_http_version 1.1;
    # 这两行是 WebSocket 升级的关键，缺一不可
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 长连接要活很久，超时给足（默认 60s 会被频繁掐断）
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
